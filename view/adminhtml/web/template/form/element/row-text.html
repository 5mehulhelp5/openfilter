<!-- A read-only value inside a table row (the option's label, values of other store views) as text, not as a greyed
     input: easier to read, and nothing to focus that cannot be changed. -->
<span class="openfilter-row-text" data-bind="text: value() || placeholder, attr: {id: uid}"></span>
