name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MODULE_NAME: Iranimij_OpenFilter
  COMPOSER_NAME: iranimij/openfilter

jobs:
  matrix:
    name: Build matrix
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.set.outputs.full }}
      integration: ${{ steps.set.outputs.integration }}
    steps:
      # Supported pairs only. Integration runs with a real search engine: OpenSearch everywhere, plus
      # Elasticsearch 8 on 2.4.7 (the last version that supports it). Pull requests run one leg; main, nightly and
      # workflow_dispatch run the full matrix (branches touching Model/Search, Model/Index or Model/Layer get a
      # dispatch run before merge, 07 · Build Brief §5).
      - id: set
        run: |
          FULL='[{"magento":"2.4.7-p10","php":"8.2"},{"magento":"2.4.7-p10","php":"8.3"},{"magento":"2.4.8-p5","php":"8.2"},{"magento":"2.4.8-p5","php":"8.3"},{"magento":"2.4.8-p5","php":"8.4"},{"magento":"2.4.9","php":"8.3"},{"magento":"2.4.9","php":"8.4"}]'
          INT_FULL='[{"magento":"2.4.7-p10","php":"8.2","engine":"elasticsearch8"},{"magento":"2.4.7-p10","php":"8.3","engine":"opensearch"},{"magento":"2.4.8-p5","php":"8.2","engine":"opensearch"},{"magento":"2.4.8-p5","php":"8.3","engine":"opensearch"},{"magento":"2.4.8-p5","php":"8.4","engine":"opensearch"},{"magento":"2.4.9","php":"8.3","engine":"opensearch"},{"magento":"2.4.9","php":"8.4","engine":"opensearch"}]'
          INT_PR='[{"magento":"2.4.9","php":"8.3","engine":"opensearch"}]'
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "integration=$INT_PR" >> "$GITHUB_OUTPUT"
          else
            echo "integration=$INT_FULL" >> "$GITHUB_OUTPUT"
          fi

  phpcs:
    name: PHPCS (Magento2 standard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extdn/github-actions-m2/magento-coding-standard/8.3@98c07d7738dc0a337c51fe608f9bbf48b83baee2

  phpstan:
    name: PHPStan level 6
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: extdn/github-actions-m2/magento-phpstan/8.3@98c07d7738dc0a337c51fe608f9bbf48b83baee2
        with:
          composer_name: ${{ env.COMPOSER_NAME }}
          phpstan_level: 6
          magento_pre_install_script: .github/ci/pre-install.sh

  unit:
    name: Unit ${{ matrix.magento }} / PHP ${{ matrix.php }}
    needs: matrix
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.full) }}
    steps:
      - uses: actions/checkout@v7
      - if: matrix.php == '8.2'
        uses: extdn/github-actions-m2/magento-unit-tests/8.2@98c07d7738dc0a337c51fe608f9bbf48b83baee2
        with:
          module_name: ${{ env.MODULE_NAME }}
          composer_name: ${{ env.COMPOSER_NAME }}
          magento_version: ${{ matrix.magento }}
          magento_pre_install_script: .github/ci/pre-install.sh
      - if: matrix.php == '8.3'
        uses: extdn/github-actions-m2/magento-unit-tests/8.3@98c07d7738dc0a337c51fe608f9bbf48b83baee2
        with:
          module_name: ${{ env.MODULE_NAME }}
          composer_name: ${{ env.COMPOSER_NAME }}
          magento_version: ${{ matrix.magento }}
          magento_pre_install_script: .github/ci/pre-install.sh
      - if: matrix.php == '8.4'
        uses: extdn/github-actions-m2/magento-unit-tests/8.4@98c07d7738dc0a337c51fe608f9bbf48b83baee2
        with:
          module_name: ${{ env.MODULE_NAME }}
          composer_name: ${{ env.COMPOSER_NAME }}
          magento_version: ${{ matrix.magento }}
          magento_pre_install_script: .github/ci/pre-install.sh

  coverage:
    name: Unit coverage (≥ 85 % on the engine namespaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov
          extensions: bcmath, gd, intl, soap, sodium, xsl, zip
      - name: Install the module's Composer dependencies from the Magento mirror
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          composer config repositories.magento composer https://repo-magento-mirror.fooman.co.nz/
          composer config --no-plugins allow-plugins.magento/composer-dependency-version-audit-plugin false
          composer require --dev --no-interaction --no-progress --no-update "phpunit/phpunit:^12.0"
          composer update --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit -c phpunit.coverage.xml --coverage-clover clover.xml --coverage-text
      # Gate namespaces grow with the code (07 · Build Brief §6: Url, Seo, Search, Config, Index).
      - run: php .github/ci/coverage-gate.php clover.xml 85 Model/Search Model/Config Model/Url Model/Index Model/Doctor Model/Seo Model/Transfer Model/Sitemap Model/GraphQl Model/Landing Model/Migration Model/Insights ViewModel

  integration:
    name: Integration ${{ matrix.magento }} / PHP ${{ matrix.php }} / ${{ matrix.engine }}
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAGENTO_VERSION: ${{ matrix.magento }}
      SEARCH_ENGINE: ${{ matrix.engine }}
      MODULE_DIR: ${{ github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.integration) }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: magento_integration_tests
        ports:
          - 3306:3306
        options: >-
          --tmpfs /tmp:rw --tmpfs /var/lib/mysql:rw
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - name: Search engine (${{ matrix.engine }})
        run: |
          if [ "$SEARCH_ENGINE" = opensearch ]; then
            docker run -d --name search -p 9200:9200 -e discovery.type=single-node -e DISABLE_SECURITY_PLUGIN=true \
              -e OPENSEARCH_JAVA_OPTS='-Xms512m -Xmx512m' opensearchproject/opensearch:2.12.0
          else
            docker run -d --name search -p 9200:9200 -e discovery.type=single-node -e xpack.security.enabled=false \
              -e ES_JAVA_OPTS='-Xms512m -Xmx512m' docker.elastic.co/elasticsearch/elasticsearch:8.17.0
          fi
          for i in $(seq 1 60); do curl -fsS 'localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' && break; sleep 3; done
          curl -fsS localhost:9200
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: bcmath, gd, intl, mbstring, pdo_mysql, soap, sockets, sodium, xsl, zip
          ini-values: memory_limit=-1
      - run: .github/ci/integration.sh

  performance:
    # Hard gate on server time (07 §6, D14): Test/Integration/Performance/ServerTimeTest, median of 7 alternating
    # renders with and without OpenFilter, alone on its runner (timing next to other work is noise).
    name: Performance (server time ≤ 15 ms over core, 2.4.9 / PHP 8.3 / OpenSearch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAGENTO_VERSION: '2.4.9'
      SEARCH_ENGINE: opensearch
      MODULE_DIR: ${{ github.workspace }}
      PHPUNIT_GROUPS: '--group performance'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: magento_integration_tests
        ports:
          - 3306:3306
        options: >-
          --tmpfs /tmp:rw --tmpfs /var/lib/mysql:rw
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - name: Search engine (opensearch)
        run: |
          docker run -d --name search -p 9200:9200 -e discovery.type=single-node -e DISABLE_SECURITY_PLUGIN=true \
            -e OPENSEARCH_JAVA_OPTS='-Xms512m -Xmx512m' opensearchproject/opensearch:2.12.0
          for i in $(seq 1 60); do curl -fsS 'localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' && break; sleep 3; done
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: bcmath, gd, intl, mbstring, pdo_mysql, soap, sockets, sodium, xsl, zip
          ini-values: memory_limit=-1
      - run: .github/ci/integration.sh

  docs:
    name: Docs (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx run --spec "mkdocs==1.6.1" mkdocs build --strict

  ci-ok:
    name: ci-ok
    if: always()
    needs: [phpcs, phpstan, unit, integration, performance, coverage, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was skipped
        run: |
          echo '${{ toJSON(needs) }}' | tee needs.json
          if echo '${{ toJSON(needs) }}' | grep -Eq '"result": "(failure|cancelled|skipped)"'; then exit 1; fi
