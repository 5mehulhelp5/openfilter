name: Bug report
description: A filter is missing, shows wrong counts, or something errors
labels: [bug]
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Magento/Mage-OS, PHP, search engine, OpenFilter, Hyvä
      placeholder: "Magento 2.4.8-p5, PHP 8.3, OpenSearch 2.12, OpenFilter 1.0.0, Hyvä 1.4.2"
    validations:
      required: true
  - type: dropdown
    id: csp
    attributes:
      label: CSP mode on the storefront
      options: [report-only, enforce, unknown]
    validations:
      required: true
  - type: dropdown
    id: varnish
    attributes:
      label: Full page cache
      options: [built-in, Varnish, none, unknown]
    validations:
      required: true
  - type: dropdown
    id: msi
    attributes:
      label: Inventory
      options: [MSI enabled, MSI disabled (legacy stock), unknown]
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Category or search URL, the filters you clicked, and what you expected to see
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: debug
    attributes:
      label: Output of `bin/magento openfilter:doctor` (if available)
